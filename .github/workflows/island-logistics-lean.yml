name: Island Logistics Lean kernel
on:
  pull_request:
    paths:
      - 'IslandLogistics/**'
      - '.github/workflows/island-logistics-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify proof kernel
        run: |
          lean --version
          lean -DwarningAsError=true IslandLogistics/Bounds.lean
