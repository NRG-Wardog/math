name: Export pinned public Lean runtime
on:
  push:
    branches: [lean-runtime]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/v4.4.0/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Export only public toolchain files
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(lean --print-prefix)"
          lean --version
          ldd "$prefix/bin/lean"
          mkdir -p /tmp/lean-runtime/bin /tmp/lean-runtime/lib export
          cp -L "$prefix/bin/lean" /tmp/lean-runtime/bin/lean
          cp -a "$prefix/lib/lean" /tmp/lean-runtime/lib/
          find /tmp/lean-runtime/lib/lean -type f \( -name '*.a' -o -name '*.ilean' -o -name '*.c' -o -name '*.o' -o -name '*.bc' \) -delete
          find "$prefix/lib" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -exec cp -a {} /tmp/lean-runtime/lib/ \;
          /tmp/lean-runtime/bin/lean --version
          echo 'import Lean' > /tmp/LeanRuntimeSmoke.lean
          echo 'example : (2 : Nat) + 2 = 4 := by omega' >> /tmp/LeanRuntimeSmoke.lean
          /tmp/lean-runtime/bin/lean /tmp/LeanRuntimeSmoke.lean
          tar -C /tmp -cf - lean-runtime | zstd -T2 -3 -o /tmp/lean-runtime.tar.zst
          sha256sum /tmp/lean-runtime.tar.zst | cut -d ' ' -f 1 > export/sha256.txt
          split -b 24M -d -a 2 /tmp/lean-runtime.tar.zst export/chunk-
          ls -lh export
          test "$(find export -name 'chunk-*' | wc -l)" -le 32
      - uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-manifest
          path: export/sha256.txt
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('export/chunk-00') != '' }}
        with:
          name: lean-runtime-00
          path: export/chunk-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('export/chunk-01') != '' }}
        with:
          name: lean-runtime-01
          path: export/chunk-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
